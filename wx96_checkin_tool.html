<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i重TV</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f6f7f9;
      color: #1f2328;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }
    section {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 10px 0 5px;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #c9d1d9;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
    }
    .compact-fields {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 14px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .action-row {
      display: grid;
      grid-template-columns: minmax(130px, 180px) repeat(4, auto);
      gap: 8px;
      align-items: end;
      margin-top: 12px;
    }
    .action-row label {
      margin: 0 0 5px;
    }
    button {
      border: 1px solid #1f6feb;
      background: #1f6feb;
      color: #fff;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: #1f2328;
      border-color: #c9d1d9;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .hint {
      color: #57606a;
      font-size: 12px;
      line-height: 1.5;
    }
    .inline-status {
      color: #57606a;
      font-size: 12px;
      margin-top: 6px;
      word-break: break-all;
    }
    .token-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 8px;
      flex-wrap: nowrap;
    }
    .token-header label {
      margin: 0;
    }
    .token-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      white-space: nowrap;
      margin-top: 0;
    }
    .token-actions button {
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.2;
    }
    .token-grid {
      display: grid;
      gap: 10px;
    }
    .token-grid.count-1 {
      grid-template-columns: 1fr;
    }
    .token-grid.count-2 {
      grid-template-columns: 1fr;
    }
    .token-grid.count-4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .token-panel {
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 10px;
      background: #f6f8fa;
    }
    .token-panel[hidden] {
      display: none;
    }
    .token-panel-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .token-panel textarea {
      min-height: 92px;
      background: #fff;
    }
    .token-grid.multi .token-panel textarea {
      min-height: 38px;
      height: 38px;
      resize: none;
      overflow: hidden;
      white-space: nowrap;
    }
    select {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #c9d1d9;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    #map {
      position: relative;
      height: 320px;
      border: 1px solid #c9d1d9;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      background: #dfe7ef;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #map.dragging {
      cursor: grabbing;
    }
    #map .tile {
      position: absolute;
      width: 256px;
      height: 256px;
      image-rendering: auto;
    }
    #mapMarker {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #d1242f;
      box-shadow: 0 1px 6px rgba(0,0,0,.45);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      pointer-events: none;
      z-index: 3;
    }
    .map-tools {
      position: absolute;
      right: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 4;
    }
    .map-tools button {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      background: #fff;
      color: #1f2328;
      border-color: #8c959f;
      box-shadow: 0 1px 4px rgba(27,31,36,.2);
      touch-action: manipulation;
    }
    .location-panel {
      margin-top: 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      overflow: hidden;
    }
    .location-panel summary {
      box-sizing: border-box;
      min-height: 42px;
      cursor: pointer;
      padding: 10px 12px;
      font: inherit;
      user-select: none;
    }
    .location-panel summary::marker {
      font-size: .8em;
    }
    .location-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
    }
    .location-box {
      border: 1px solid #c9d1d9;
      border-radius: 6px;
      padding: 10px;
      background: #fff;
    }
    .quick-location-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-location-bar button {
      width: auto;
      min-width: 0;
      padding: 7px 10px;
      font-size: 13px;
    }
    .quick-location-bar button.selected {
      background: #0969da;
      border-color: #0969da;
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
    }
    .status {
      white-space: pre-wrap;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 6px;
      padding: 12px;
      min-height: 90px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
    @media (max-width: 680px) {
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .token-grid.count-4 { grid-template-columns: 1fr; }
      .action-row { grid-template-columns: 1fr; }
      button { width: 100%; }
      .map-tools button { width: 38px; }
      .quick-location-bar button {
        width: auto;
        flex: 1 1 calc(50% - 8px);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>i重TV</h1>

    <section>
      <div class="token-header">
        <label>Token / 凭证包</label>
        <div class="token-actions">
          <button class="secondary" id="removeTokenBtn">减少 token</button>
          <button class="secondary" id="addTokenBtn">添加 token</button>
        </div>
      </div>
      <div id="tokenGrid" class="token-grid count-1">
        <div class="token-panel" data-token-panel="0">
          <div class="token-panel-title">账号 1</div>
          <textarea id="token0" class="token-input" placeholder="粘贴 CMD 输出的 Credential，或旧版纯 token"></textarea>
          <div id="tokenInfo0" class="inline-status">Token 未填写</div>
        </div>
        <div class="token-panel" data-token-panel="1" hidden>
          <div class="token-panel-title">账号 2</div>
          <textarea id="token1" class="token-input" placeholder="粘贴第二个 Credential"></textarea>
          <div id="tokenInfo1" class="inline-status">Token 未填写</div>
        </div>
        <div class="token-panel" data-token-panel="2" hidden>
          <div class="token-panel-title">账号 3</div>
          <textarea id="token2" class="token-input" placeholder="粘贴第三个 Credential"></textarea>
          <div id="tokenInfo2" class="inline-status">Token 未填写</div>
        </div>
        <div class="token-panel" data-token-panel="3" hidden>
          <div class="token-panel-title">账号 4</div>
          <textarea id="token3" class="token-input" placeholder="粘贴第四个 Credential"></textarea>
          <div id="tokenInfo3" class="inline-status">Token 未填写</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="courseSelect">课程</label>
          <select id="courseSelect">
            <option value="">先获取课程列表，或手动填写</option>
          </select>
        </div>
        <div class="compact-fields">
          <div>
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" value="https://icq.cqust.edu.cn/icqust-admin">
          </div>
          <div>
            <label for="classNum">class_num</label>
            <input id="classNum" placeholder="例如 3GS1290A.13">
          </div>
          <div>
            <label for="teacherId">class_teacherid</label>
            <input id="teacherId" placeholder="例如 2019056">
          </div>
        </div>
      </div>

      <div class="location-field">
        <label>位置（多个楼时自动匹配可能异常）</label>
        <div class="location-box">
          <div class="quick-location-bar" id="quickLocationBar" aria-label="快捷位置">
            <button class="secondary" id="geoBtn">读取当前位置</button>
          </div>
          <details class="location-panel" id="locationPanel">
            <summary id="locationPanelSummary">其他位置</summary>
            <div class="location-body">
              <div>
                <label for="lng">经度</label>
                <input id="lng" inputmode="decimal" placeholder="例如 106.605">
              </div>
              <div>
                <label for="lat">纬度</label>
                <input id="lat" inputmode="decimal" placeholder="例如 29.539">
              </div>
              <div id="map">
                <div class="map-tools">
                  <button class="secondary" id="zoomInBtn" title="地图放大">+</button>
                  <button class="secondary" id="zoomOutBtn" title="地图缩小">-</button>
                  <button class="secondary" id="centerSchoolBtn" title="回到默认位置">◎</button>
                </div>
                <div id="mapMarker"></div>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div class="action-row">
        <div>
          <label for="signCode">6 位签到码</label>
          <input id="signCode" inputmode="numeric" maxlength="6" placeholder="例如 123456">
        </div>
        <button id="sendBtn">发送签到请求</button>
        <button class="secondary" id="coursesBtn">获取课程列表</button>
        <button class="secondary" id="copyJsonBtn">复制 JSON</button>
        <button class="secondary" id="copyCurlBtn">复制 curl</button>
      </div>
      <p class="hint">请求体格式：{"cnum":"class_num-teacherId-签到码","location":"纬度:lat经度:lng"}。地图使用高德 GCJ-02 坐标。</p>
    </section>

    <section>
      <label for="preview">请求预览</label>
      <textarea id="preview" readonly></textarea>
    </section>

    <section>
      <label>输出</label>
      <div id="status" class="status">等待操作</div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const ids = ["classNum", "teacherId", "signCode", "baseUrl", "lat", "lng"];
    const maxTokenPanes = 4;
    const storageKeys = {
      token: "wx96_tool_token",
      tokens: "wx96_tool_tokens",
      tokenPaneCount: "wx96_tool_token_pane_count",
      baseUrl: "wx96_tool_base_url",
      lastCourse: "wx96_tool_last_course",
      lat: "wx96_tool_lat",
      lng: "wx96_tool_lng",
      geoLat: "wx96_tool_geo_lat",
      geoLng: "wx96_tool_geo_lng"
    };
    const defaultCenter = [29.590971, 106.322829];
    const oldDefaultCenter = [29.5948, 106.3032];
    const quickLocations = [
      { name: "教学主楼（ABCD）", aliases: ["教学主楼", "教学楼A", "教学楼B", "教学楼C", "教学楼D", "主楼A", "主楼B", "主楼C", "主楼D"], lat: defaultCenter[0], lng: defaultCenter[1], zoom: 16 },
      { name: "博学楼（EF）", aliases: ["博学楼"], lat: 29.588486, lng: 106.324481, zoom: 16 },
      { name: "厚德楼（G）", aliases: ["厚德楼"], lat: 29.588418, lng: 106.322018, zoom: 16 },
      { name: "逸夫楼（I）", aliases: ["逸夫楼"], lat: 29.588332, lng: 106.320575, zoom: 16 }
    ];
    let mapState = { lat: defaultCenter[0], lng: defaultCenter[1], zoom: 16 };
    const tileSize = 256;
    const minMapZoom = 3;
    const maxMapZoom = 18;
    let autoCourseTimer = null;
    let lastAutoCourseToken = "";
    let isDraggingMap = false;
    let dragStart = null;
    const activePointers = new Map();
    let pinchStart = null;
    let tokenPaneCount = 1;
    const courseMap = new Map();
    const credentialSeparator = "#WX96KEY#";

    function tokenValue() {
      const first = credentialAt(0);
      return first ? first.token : "";
    }

    function tokenAt(index) {
      const credential = credentialAt(index);
      return credential ? credential.token : "";
    }

    function rawCredentialAt(index) {
      return $(`token${index}`).value.trim();
    }

    function parseCredential(raw) {
      raw = String(raw || "").trim();
      if (!raw) return null;

      const parts = raw.split(credentialSeparator);
      const token = parts[0].trim().replace(/^Bearer\s+/i, "");
      let cryptoKey = null;

      if (parts.length > 1) {
        try {
          cryptoKey = JSON.parse(parts.slice(1).join(credentialSeparator).trim());
        } catch {
          cryptoKey = { invalid: true };
        }
      }

      return { raw, token, cryptoKey };
    }

    function credentialAt(index) {
      const parsed = parseCredential(rawCredentialAt(index));
      if (!parsed || !parsed.token) return null;
      return parsed;
    }

    function allTokens() {
      const result = [];
      for (let i = 0; i < tokenPaneCount; i++) {
        const credential = credentialAt(i);
        if (credential) result.push({ index: i, label: `账号 ${i + 1}`, ...credential });
      }
      return result;
    }

    function endpoint(path) {
      return $("baseUrl").value.trim().replace(/\/+$/, "") + path;
    }

    function bodyObject() {
      const classNum = $("classNum").value.trim();
      const teacherId = $("teacherId").value.trim();
      const code = $("signCode").value.trim();
      const lat = $("lat").value.trim();
      const lng = $("lng").value.trim();
      return {
        cnum: `${classNum}-${teacherId}-${code}`,
        location: `纬度:${lat}经度:${lng}`
      };
    }

    function getJwtPayload(token) {
      const parts = token.split(".");
      if (parts.length < 2) return null;
      let payload = parts[1].replace(/-/g, "+").replace(/_/g, "/");
      while (payload.length % 4) payload += "=";
      try {
        return JSON.parse(decodeURIComponent(Array.from(atob(payload), c =>
          "%" + c.charCodeAt(0).toString(16).padStart(2, "0")
        ).join("")));
      } catch {
        try { return JSON.parse(atob(payload)); } catch { return null; }
      }
    }

    function formatRemaining(ms) {
      if (ms <= 0) return "已过期";
      const minutes = Math.floor(ms / 60000);
      const hours = Math.floor(minutes / 60);
      return `${hours}h ${minutes % 60}m`;
    }

    function updateTokenInfo() {
      for (let i = 0; i < maxTokenPanes; i++) {
        const info = $(`tokenInfo${i}`);
        if (!info) continue;
        const credential = credentialAt(i);
        if (!credential) {
          info.textContent = "凭证未填写";
          continue;
        }
        const { token, cryptoKey } = credential;
        const payload = getJwtPayload(token);
        if (!payload || !payload.exp) {
          info.textContent = "Token 已填写，无法解析过期时间";
          continue;
        }
        const expiresAt = new Date(payload.exp * 1000);
        let keyText = "未带 crypto_key_info";
        if (cryptoKey && cryptoKey.invalid) {
          keyText = "crypto_key_info 格式错误";
        } else if (cryptoKey && cryptoKey.expireAt) {
          const keyExpiresAt = new Date(Number(cryptoKey.expireAt));
          keyText = `key 过期：${keyExpiresAt.toLocaleString()}，剩余：${formatRemaining(keyExpiresAt - new Date())}`;
        } else if (cryptoKey) {
          keyText = "已带 crypto_key_info";
        }
        info.textContent = `Token 过期：${expiresAt.toLocaleString()}，剩余：${formatRemaining(expiresAt - new Date())}；${keyText}`;
      }
    }

    function md5(input) {
      function add32(a, b) { return (a + b) & 0xffffffff; }
      function cmn(q, a, b, x, s, t) {
        a = add32(add32(a, q), add32(x, t));
        return add32((a << s) | (a >>> (32 - s)), b);
      }
      function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
      function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
      function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
      function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
      function block(words, state) {
        let [a, b, c, d] = state;
        const olda = a, oldb = b, oldc = c, oldd = d;
        a = ff(a, b, c, d, words[0], 7, -680876936); d = ff(d, a, b, c, words[1], 12, -389564586);
        c = ff(c, d, a, b, words[2], 17, 606105819); b = ff(b, c, d, a, words[3], 22, -1044525330);
        a = ff(a, b, c, d, words[4], 7, -176418897); d = ff(d, a, b, c, words[5], 12, 1200080426);
        c = ff(c, d, a, b, words[6], 17, -1473231341); b = ff(b, c, d, a, words[7], 22, -45705983);
        a = ff(a, b, c, d, words[8], 7, 1770035416); d = ff(d, a, b, c, words[9], 12, -1958414417);
        c = ff(c, d, a, b, words[10], 17, -42063); b = ff(b, c, d, a, words[11], 22, -1990404162);
        a = ff(a, b, c, d, words[12], 7, 1804603682); d = ff(d, a, b, c, words[13], 12, -40341101);
        c = ff(c, d, a, b, words[14], 17, -1502002290); b = ff(b, c, d, a, words[15], 22, 1236535329);
        a = gg(a, b, c, d, words[1], 5, -165796510); d = gg(d, a, b, c, words[6], 9, -1069501632);
        c = gg(c, d, a, b, words[11], 14, 643717713); b = gg(b, c, d, a, words[0], 20, -373897302);
        a = gg(a, b, c, d, words[5], 5, -701558691); d = gg(d, a, b, c, words[10], 9, 38016083);
        c = gg(c, d, a, b, words[15], 14, -660478335); b = gg(b, c, d, a, words[4], 20, -405537848);
        a = gg(a, b, c, d, words[9], 5, 568446438); d = gg(d, a, b, c, words[14], 9, -1019803690);
        c = gg(c, d, a, b, words[3], 14, -187363961); b = gg(b, c, d, a, words[8], 20, 1163531501);
        a = gg(a, b, c, d, words[13], 5, -1444681467); d = gg(d, a, b, c, words[2], 9, -51403784);
        c = gg(c, d, a, b, words[7], 14, 1735328473); b = gg(b, c, d, a, words[12], 20, -1926607734);
        a = hh(a, b, c, d, words[5], 4, -378558); d = hh(d, a, b, c, words[8], 11, -2022574463);
        c = hh(c, d, a, b, words[11], 16, 1839030562); b = hh(b, c, d, a, words[14], 23, -35309556);
        a = hh(a, b, c, d, words[1], 4, -1530992060); d = hh(d, a, b, c, words[4], 11, 1272893353);
        c = hh(c, d, a, b, words[7], 16, -155497632); b = hh(b, c, d, a, words[10], 23, -1094730640);
        a = hh(a, b, c, d, words[13], 4, 681279174); d = hh(d, a, b, c, words[0], 11, -358537222);
        c = hh(c, d, a, b, words[3], 16, -722521979); b = hh(b, c, d, a, words[6], 23, 76029189);
        a = hh(a, b, c, d, words[9], 4, -640364487); d = hh(d, a, b, c, words[12], 11, -421815835);
        c = hh(c, d, a, b, words[15], 16, 530742520); b = hh(b, c, d, a, words[2], 23, -995338651);
        a = ii(a, b, c, d, words[0], 6, -198630844); d = ii(d, a, b, c, words[7], 10, 1126891415);
        c = ii(c, d, a, b, words[14], 15, -1416354905); b = ii(b, c, d, a, words[5], 21, -57434055);
        a = ii(a, b, c, d, words[12], 6, 1700485571); d = ii(d, a, b, c, words[3], 10, -1894986606);
        c = ii(c, d, a, b, words[10], 15, -1051523); b = ii(b, c, d, a, words[1], 21, -2054922799);
        a = ii(a, b, c, d, words[8], 6, 1873313359); d = ii(d, a, b, c, words[15], 10, -30611744);
        c = ii(c, d, a, b, words[6], 15, -1560198380); b = ii(b, c, d, a, words[13], 21, 1309151649);
        a = ii(a, b, c, d, words[4], 6, -145523070); d = ii(d, a, b, c, words[11], 10, -1120210379);
        c = ii(c, d, a, b, words[2], 15, 718787259); b = ii(b, c, d, a, words[9], 21, -343485551);
        return [add32(a, olda), add32(b, oldb), add32(c, oldc), add32(d, oldd)];
      }
      const bytes = Array.from(new TextEncoder().encode(input));
      const bitLen = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      for (let i = 0; i < 8; i++) bytes.push(Math.floor(bitLen / Math.pow(2, 8 * i)) & 255);
      let state = [1732584193, -271733879, -1732584194, 271733878];
      for (let i = 0; i < bytes.length; i += 64) {
        const words = [];
        for (let j = 0; j < 64; j += 4) {
          words.push(bytes[i + j] | (bytes[i + j + 1] << 8) | (bytes[i + j + 2] << 16) | (bytes[i + j + 3] << 24));
        }
        state = block(words, state);
      }
      return state.map(n => {
        let out = "";
        for (let i = 0; i < 4; i++) out += ((n >>> (8 * i)) & 255).toString(16).padStart(2, "0");
        return out;
      }).join("");
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.slice(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function wordArrayToBytes(wordArray) {
      const bytes = new Uint8Array(wordArray.sigBytes);
      for (let i = 0; i < wordArray.sigBytes; i++) {
        bytes[i] = (wordArray.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 255;
      }
      return bytes;
    }

    function bytesToWordArray(bytes) {
      const words = [];
      for (let i = 0; i < bytes.length; i++) {
        words[i >>> 2] |= bytes[i] << (24 - (i % 4) * 8);
      }
      return CryptoJS.lib.WordArray.create(words, bytes.length);
    }

    function decodeJsonFromBytes(bytes) {
      const starts = [];
      for (let i = 0; i < bytes.length; i++) {
        if (bytes[i] === 0x7b || bytes[i] === 0x5b) starts.push(i);
      }
      for (const start of starts) {
        const text = new TextDecoder().decode(bytes.slice(start)).trim();
        try {
          return JSON.parse(text);
        } catch {}
        if (text.startsWith("{")) {
          try {
            return JSON.parse("[" + text);
          } catch {}
          try {
            return JSON.parse("[" + text + "]");
          } catch {}
        }
      }
      const text = new TextDecoder().decode(bytes).replace(/\0/g, "").trim();
      const courseStart = text.match(/^\d+,\s*"class_num"\s*:/);
      if (courseStart) {
        try {
          return JSON.parse('[{"class_id":136' + text);
        } catch {}
      }
      return null;
    }

    function keyModeForVersion(cryptoKey) {
      return Number(cryptoKey && cryptoKey.version) >= 2 ? "base64" : "utf8";
    }

    function requestPlainText(body) {
      return JSON.stringify(body);
    }

    function randomBytes(length) {
      const bytes = new Uint8Array(length);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        for (let i = 0; i < length; i++) bytes[i] = Math.floor(Math.random() * 256);
      }
      return bytes;
    }

    function decodeCryptoText(text, mode) {
      if (mode === "base64-padded") {
        const bytes = base64ToBytes(text);
        if (bytes.length >= 16) return bytes.slice(0, 16);
        const padded = new Uint8Array(16);
        padded.set(bytes);
        return padded;
      }
      return mode === "base64" ? base64ToBytes(text) : new TextEncoder().encode(text);
    }

    function cryptoJsParseText(text, mode) {
      if (mode === "base64-padded") return bytesToWordArray(decodeCryptoText(text, mode));
      return mode === "base64" ? CryptoJS.enc.Base64.parse(text) : CryptoJS.enc.Utf8.parse(text);
    }

    async function importAesKey(cryptoKey, keyMode = "utf8", ivMode = keyMode) {
      if (!cryptoKey || cryptoKey.invalid) {
        throw new Error("缺少或无法解析 crypto_key_info，请粘贴 CMD 输出的 Credential");
      }
      const keyText = String(cryptoKey.encryptKey || "");
      const ivText = String(cryptoKey.iv || "");
      const keyBytes = decodeCryptoText(keyText, keyMode);
      const ivBytes = decodeCryptoText(ivText, ivMode);
      if (![16, 24, 32].includes(keyBytes.length) || ![12, 16].includes(ivBytes.length)) {
        throw new Error(`crypto_key_info 长度异常，key=${keyBytes.length} iv=${ivBytes.length}`);
      }
      const subtle = window.crypto && window.crypto.subtle;
      return {
        keyBytes,
        ivBytes,
        subtleKey: subtle ? await subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["encrypt", "decrypt"]) : null,
        cryptoJsKey: window.CryptoJS ? cryptoJsParseText(keyText, keyMode) : null,
        cryptoJsIv: window.CryptoJS ? cryptoJsParseText(ivText, ivMode) : null
      };
    }

    async function encryptRequestBody(body, cryptoKey) {
      const isOfficialKey = Number(cryptoKey && cryptoKey.version) >= 2;
      const aes = isOfficialKey
        ? await importAesKey(cryptoKey, "base64", "base64-padded")
        : await importAesKey(cryptoKey, keyModeForVersion(cryptoKey));
      const requestBytes = new TextEncoder().encode(requestPlainText(body));
      if (aes.subtleKey && window.crypto && window.crypto.subtle) {
        const encrypted = await window.crypto.subtle.encrypt(
          { name: "AES-CBC", iv: aes.ivBytes },
          aes.subtleKey,
          requestBytes
        );
        return bytesToBase64(new Uint8Array(encrypted));
      }
      if (!window.CryptoJS) {
        throw new Error("浏览器不支持 WebCrypto，且 CryptoJS 加载失败，无法生成新版加密请求");
      }
      const requestPlain = isOfficialKey
        ? CryptoJS.enc.Base64.parse(bytesToBase64(requestBytes))
        : requestPlainText(body);
      return CryptoJS.AES.encrypt(requestPlain, aes.cryptoJsKey, {
        iv: aes.cryptoJsIv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      }).ciphertext.toString(CryptoJS.enc.Base64);
    }

    async function decryptAesBase64(encData, aes, dropFirstBlock = false) {
      let ciphertext = String(encData || "");
      let ivBytes = aes.ivBytes;
      let cryptoJsIv = aes.cryptoJsIv;
      if (ciphertext.includes(":")) {
        const parts = ciphertext.split(":");
        if (parts.length >= 2) {
          ivBytes = base64ToBytes(parts[0]);
          cryptoJsIv = window.CryptoJS ? CryptoJS.enc.Base64.parse(parts[0]) : cryptoJsIv;
          ciphertext = parts.slice(1).join(":");
        }
      }
      if (dropFirstBlock) {
        const bytes = base64ToBytes(ciphertext);
        if (bytes.length <= 16) return new Uint8Array();
        ciphertext = bytesToBase64(bytes.slice(16));
      }
      if (aes.subtleKey && window.crypto && window.crypto.subtle) {
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-CBC", iv: ivBytes },
          aes.subtleKey,
          base64ToBytes(ciphertext)
        );
        return new Uint8Array(decrypted);
      }
      if (!window.CryptoJS) {
        throw new Error("浏览器不支持 WebCrypto，且 CryptoJS 加载失败，无法解析新版加密响应");
      }
      const decrypted = CryptoJS.AES.decrypt({ ciphertext: CryptoJS.enc.Base64.parse(ciphertext) }, aes.cryptoJsKey, {
        iv: cryptoJsIv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      });
      return wordArrayToBytes(decrypted);
    }

    async function decryptResponseBody(responseBody, cryptoKey) {
      if (!responseBody || !responseBody.encData || !cryptoKey || cryptoKey.invalid) return responseBody;
      if (String(responseBody.encData || "").length < 64) return responseBody;
      const errors = [];
      const attempts = Number(cryptoKey.version) >= 2
        ? [
            { keyMode: "base64", ivMode: "base64-padded", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "utf8", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "utf8", dropFirstBlock: true },
            { keyMode: "base64", ivMode: "base64", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "base64", dropFirstBlock: true },
            { keyMode: "utf8", ivMode: "utf8", dropFirstBlock: false }
          ]
        : [
            { keyMode: "utf8", ivMode: "utf8", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "utf8", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "base64-padded", dropFirstBlock: false },
            { keyMode: "base64", ivMode: "base64", dropFirstBlock: false }
          ];
      for (const attempt of attempts) {
        try {
          const aes = await importAesKey(cryptoKey, attempt.keyMode, attempt.ivMode);
          const bytes = await decryptAesBase64(responseBody.encData, aes, attempt.dropFirstBlock);
          if (!bytes.length) continue;
          const parsed = decodeJsonFromBytes(bytes);
          if (parsed) return parsed;
        } catch (err) {
          errors.push(`${attempt.keyMode}/${attempt.ivMode}${attempt.dropFirstBlock ? "/drop16" : ""}: ${err.message}`);
        }
      }
      return { ...responseBody, decryptError: errors.join("; ") || "未能解析加密响应" };
    }

    const platformHeader = "wechat_mp";
    const signSecretCache = new Map();

    async function parseResponse(res) {
      const text = await res.text();
      let parsed = text;
      try { parsed = JSON.parse(text); } catch {}
      return { status: res.status, ok: res.ok, body: parsed };
    }

    async function getSignSecret(token) {
      if (signSecretCache.has(token)) return signSecretCache.get(token);
      const res = await fetch(endpoint("/wechat/checkToken"), {
        method: "GET",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
          "X-Platform": platformHeader
        }
      });
      const result = await parseResponse(res);
      const body = result.body || {};
      const secret = body.data && body.data.signSecret;
      if (!result.ok || !(body.code === 200 || body.code === 0) || !secret) {
        throw new Error((body.msg || body.message || "checkToken 未返回 signSecret") + ` (HTTP ${result.status})`);
      }
      signSecretCache.set(token, secret);
      return secret;
    }

    function generateNonce() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let out = "";
      for (let i = 0; i < 8; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    async function signedHeaders(method, path, account, { bodyHash = "", query = "", encrypted = true } = {}) {
      const signSecret = await getSignSecret(account.token);
      const timestamp = Date.now().toString();
      const nonce = generateNonce();
      const headers = {
        Authorization: "Bearer " + account.token,
        "Content-Type": "application/json",
        "X-Platform": platformHeader,
        "X-Timestamp": timestamp,
        "X-Sign-Version": "2",
        "X-Nonce": nonce,
        "X-Body-Hash": bodyHash,
        "X-Sign": md5(`${method.toUpperCase()}|${path}|${query}|${bodyHash}|${timestamp}|${nonce}|${signSecret}`)
      };
      if (encrypted && account.cryptoKey && !account.cryptoKey.invalid) {
        headers["X-Encrypt-Type"] = account.cryptoKey.type || "wechat_official";
        headers["X-Enc-Version"] = String(account.cryptoKey.version || 1);
      }
      return headers;
    }

    function shouldRetrySignedRequest(result, token) {
      const body = result && result.body;
      const code = body && Number(body.code);
      const msg = body && String(body.msg || body.message || "");
      if (code === 4011 || code === 4014 || /签名|signSecret/i.test(msg)) {
        signSecretCache.delete(token);
        return true;
      }
      return code === 4012 || code === 4013 || /请求已过期|已被使用/.test(msg);
    }

    function requestPreview() {
      const firstAccount = allTokens()[0];
      const encVersion = firstAccount && firstAccount.cryptoKey && !firstAccount.cryptoKey.invalid
        ? String(firstAccount.cryptoKey.version || 1)
        : "<crypto_key_info.version>";
      return {
        url: endpoint("/wechat/checkIn/checkInWithLocation"),
        method: "POST",
        headers: {
          Authorization: "Bearer <每个账号的 token>",
          "Content-Type": "application/json",
          "X-Platform": "wechat_mp",
          "X-Timestamp": "<当前毫秒时间戳>",
          "X-Sign-Version": "2",
          "X-Nonce": "<8位随机字符串>",
          "X-Body-Hash": "MD5(encData).slice(0,16)",
          "X-Encrypt-Type": "wechat_official",
          "X-Enc-Version": encVersion,
          "X-Sign": "MD5(POST|/wechat/checkIn/checkInWithLocation||X-Body-Hash|X-Timestamp|X-Nonce|signSecret)"
        },
        accountCount: allTokens().length,
        plainBody: bodyObject(),
        wireBody: { encData: "<由 crypto_key_info 加密 plainBody 得到>" }
      };
    }

    function updatePreview() {
      $("preview").value = JSON.stringify(requestPreview(), null, 2);
      updateTokenInfo();
      saveState();
    }

    function setStatus(text) {
      $("status").textContent = text;
    }

    function geolocationErrorText(err) {
      const tips = [
        "可改用地图点击或拖动来选择经纬度。",
        "手机浏览器通常要求 HTTPS 页面才会弹定位权限；file:// 或普通 http:// 局域网页面可能直接失败。",
        "电脑端还需要系统定位服务可用，台式机或未开启系统定位时即使同意也可能失败。"
      ];
      const suffix = "\n\n" + tips.join("\n");

      if (!window.isSecureContext) {
        return "ERROR: 当前页面不是安全上下文，浏览器可能禁止网页定位。" + suffix;
      }

      if (!err) {
        return "ERROR: 定位失败，原因未知。" + suffix;
      }

      if (err.code === 1) {
        return "ERROR: 定位权限被拒绝，或浏览器没有弹出权限请求。" + suffix;
      }

      if (err.code === 2) {
        return "ERROR: 当前位置不可用，系统或浏览器没有拿到有效定位。" + suffix;
      }

      if (err.code === 3) {
        return "ERROR: 定位超时，没有在限定时间内拿到位置。" + suffix;
      }

      return "ERROR: 定位失败：" + (err.message || "未知错误") + suffix;
    }

    function validateSignInput() {
      const tokens = allTokens();
      const { cnum, location } = bodyObject();
      const code = $("signCode").value.trim();
      if (tokens.length === 0) throw new Error("至少需要填写一个凭证");
      const missingKey = tokens.find(item => !item.cryptoKey || item.cryptoKey.invalid);
      if (missingKey) throw new Error(`${missingKey.label} 缺少有效 crypto_key_info，请粘贴 CMD 输出的 Credential`);
      if (!$("classNum").value.trim()) throw new Error("缺少 class_num");
      if (!$("teacherId").value.trim()) throw new Error("缺少 class_teacherid");
      if (!/^\d{6}$/.test(code)) throw new Error("签到码必须是 6 位数字");
      if (!$("lat").value.trim() || !$("lng").value.trim()) throw new Error("缺少经纬度");
      return { cnum, location };
    }

    async function postJson(path, body, account = allTokens()[0]) {
      if (!account || !account.cryptoKey || account.cryptoKey.invalid) {
        throw new Error("缺少有效 crypto_key_info，无法生成新版加密请求");
      }
      const encData = await encryptRequestBody(body, account.cryptoKey);
      const bodyHash = md5(encData).slice(0, 16);
      const wireBody = JSON.stringify({ encData });
      let res = await fetch(endpoint(path), {
        method: "POST",
        headers: await signedHeaders("POST", path, account, { bodyHash }),
        body: wireBody
      });
      let result = await parseResponse(res);
      result.body = await decryptResponseBody(result.body, account.cryptoKey);
      if (shouldRetrySignedRequest(result, account.token)) {
        res = await fetch(endpoint(path), {
          method: "POST",
          headers: await signedHeaders("POST", path, account, { bodyHash }),
          body: wireBody
        });
        result = await parseResponse(res);
        result.body = await decryptResponseBody(result.body, account.cryptoKey);
      }
      return result;
    }

    async function getJson(path, account = allTokens()[0]) {
      if (!account || !account.cryptoKey || account.cryptoKey.invalid) {
        throw new Error("缺少有效 crypto_key_info，无法读取新版加密响应");
      }
      let res = await fetch(endpoint(path), {
        method: "GET",
        headers: await signedHeaders("GET", path, account)
      });
      let result = await parseResponse(res);
      result.body = await decryptResponseBody(result.body, account.cryptoKey);
      if (shouldRetrySignedRequest(result, account.token)) {
        res = await fetch(endpoint(path), {
          method: "GET",
          headers: await signedHeaders("GET", path, account)
        });
        result = await parseResponse(res);
        result.body = await decryptResponseBody(result.body, account.cryptoKey);
      }
      return result;
    }

    async function loadCourses({ silent = false, auto = false } = {}) {
      const tokens = allTokens();
      if (tokens.length === 0) throw new Error("至少需要填写一个凭证");
      if (!silent) setStatus("正在获取课程列表...");
      const results = [];
      courseMap.clear();
      for (const account of tokens) {
        try {
          const result = await getJson("/wechat/checkIn/myCourses", account);
          results.push({ account: account.label, ok: true, result });
          if (Array.isArray(result.body)) {
            mergeCourses(result.body, account.label);
          } else if (result.body && result.body.data) {
            mergeCourses(result.body.data, account.label);
          }
        } catch (err) {
          results.push({ account: account.label, ok: false, error: err.message });
        }
      }
      renderCourses();
      if (!silent) {
        setStatus(JSON.stringify(results, null, 2));
      } else if (auto) {
        setStatus(`已自动获取课程列表：${courseMap.size} 门，账号数：${tokens.length}`);
      }
      return results;
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
      setStatus("已复制");
    }

    async function curlCommand() {
      const path = "/wechat/checkIn/checkInWithLocation";
      const commands = [];
      for (const account of allTokens()) {
        if (!account.cryptoKey || account.cryptoKey.invalid) {
          throw new Error(`${account.label} 缺少有效 crypto_key_info`);
        }
        const plainBody = bodyObject();
        const encData = await encryptRequestBody(plainBody, account.cryptoKey);
        const bodyHash = md5(encData).slice(0, 16);
        const body = JSON.stringify({ encData }).replace(/'/g, "'\\''");
        const headers = await signedHeaders("POST", path, account, { bodyHash });
        commands.push([
          "# " + account.label,
          "curl -X POST",
          `'${endpoint(path)}'`,
          "-H 'Authorization: Bearer " + account.token.replace(/'/g, "'\\''") + "'",
          "-H 'Content-Type: application/json'",
          "-H 'X-Platform: " + platformHeader + "'",
          "-H 'X-Timestamp: " + headers["X-Timestamp"] + "'",
          "-H 'X-Sign-Version: " + headers["X-Sign-Version"] + "'",
          "-H 'X-Nonce: " + headers["X-Nonce"] + "'",
          "-H 'X-Body-Hash: " + headers["X-Body-Hash"] + "'",
          "-H 'X-Encrypt-Type: " + headers["X-Encrypt-Type"] + "'",
          "-H 'X-Enc-Version: " + headers["X-Enc-Version"] + "'",
          "-H 'X-Sign: " + headers["X-Sign"] + "'",
          `--data '${body}'`
        ].join(" "));
      }
      return commands.join("\n\n");
    }

    function applyTokenPaneCount() {
      tokenPaneCount = tokenPaneCount >= 4 ? 4 : tokenPaneCount >= 2 ? 2 : 1;
      $("tokenGrid").className = `token-grid count-${tokenPaneCount}${tokenPaneCount > 1 ? " multi" : ""}`;
      for (let i = 0; i < maxTokenPanes; i++) {
        const panel = document.querySelector(`[data-token-panel="${i}"]`);
        if (panel) panel.hidden = i >= tokenPaneCount;
      }
      $("addTokenBtn").disabled = tokenPaneCount >= maxTokenPanes;
      $("addTokenBtn").textContent = tokenPaneCount >= maxTokenPanes ? "最多 4 个 token" : "添加 token";
      $("removeTokenBtn").disabled = tokenPaneCount <= 1;
    }

    function saveState() {
      localStorage.setItem(storageKeys.token, rawCredentialAt(0));
      localStorage.setItem(storageKeys.tokens, JSON.stringify(Array.from({ length: maxTokenPanes }, (_, i) => rawCredentialAt(i))));
      localStorage.setItem(storageKeys.tokenPaneCount, String(tokenPaneCount));
      localStorage.setItem(storageKeys.baseUrl, $("baseUrl").value.trim());
      localStorage.setItem(storageKeys.lat, $("lat").value.trim());
      localStorage.setItem(storageKeys.lng, $("lng").value.trim());
      localStorage.setItem(storageKeys.lastCourse, $("courseSelect").value);
    }

    function restoreState() {
      let savedTokens = [];
      try {
        savedTokens = JSON.parse(localStorage.getItem(storageKeys.tokens) || "[]");
      } catch {
        savedTokens = [];
      }
      if (!savedTokens.length) {
        savedTokens = [localStorage.getItem(storageKeys.token) || ""];
      }
      for (let i = 0; i < maxTokenPanes; i++) {
        $(`token${i}`).value = savedTokens[i] || "";
      }
      const savedCount = parseInt(localStorage.getItem(storageKeys.tokenPaneCount) || "1", 10);
      tokenPaneCount = savedCount >= 4 ? 4 : savedCount >= 2 ? 2 : 1;
      if (savedTokens.slice(2, 4).some(Boolean)) tokenPaneCount = 4;
      else if (savedTokens[1]) tokenPaneCount = Math.max(tokenPaneCount, 2);
      applyTokenPaneCount();
      $("baseUrl").value = localStorage.getItem(storageKeys.baseUrl) || $("baseUrl").value;
      const savedLat = localStorage.getItem(storageKeys.lat) || "";
      const savedLng = localStorage.getItem(storageKeys.lng) || "";
      const isOldDefault = Math.abs(parseFloat(savedLat) - oldDefaultCenter[0]) < 0.000001
        && Math.abs(parseFloat(savedLng) - oldDefaultCenter[1]) < 0.000001;
      $("lat").value = isOldDefault ? "" : savedLat;
      $("lng").value = isOldDefault ? "" : savedLng;
    }

    function fillCourseFromValue(value) {
      if (!value) return;
      const [classNum, teacherId] = value.split(",");
      if (classNum) $("classNum").value = classNum;
      if (teacherId) $("teacherId").value = teacherId;
      const course = courseMap.get(value);
      const location = findQuickLocationForCourse(course);
      if (location) setLatLng(location.lat, location.lng, location.zoom || 16);
      updatePreview();
    }

    function findQuickLocationForCourse(course) {
      if (!course) return null;
      const text = [course.location, course.info].filter(Boolean).join("|");
      if (!text) return null;
      return quickLocations.find(location =>
        (location.aliases || [location.name]).some(alias => text.includes(alias))
      ) || null;
    }

    function mergeCourses(data, accountLabel) {
      const rows = Array.isArray(data) ? data : [];
      for (const course of rows) {
        const classNum = course.class_num || course.classNum || course.code || "";
        const teacherId = course.class_teacherid || course.teacherId || course.classTeacherid || "";
        if (!classNum || !teacherId) continue;
        const key = `${classNum},${teacherId}`;
        const name = course.class_name || course.name || "";
        const teacher = course.teacher_name || course.teacher || "";
        const location = course.class_location || course.location || "";
        const info = course.class_info || course.info || "";
        const old = courseMap.get(key);
        if (old) {
          old.accounts.add(accountLabel);
          if (!old.location && location) old.location = location;
          if (!old.info && info) old.info = info;
        } else {
          courseMap.set(key, { classNum, teacherId, name, teacher, location, info, accounts: new Set([accountLabel]) });
        }
      }
    }

    function renderCourses() {
      const select = $("courseSelect");
      const current = select.value || localStorage.getItem(storageKeys.lastCourse) || "";
      select.innerHTML = '<option value="">手动填写</option>';
      for (const [key, course] of Array.from(courseMap.entries()).sort((a, b) => a[0].localeCompare(b[0]))) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = [
          course.classNum,
          course.teacherId,
          course.name,
          course.teacher,
          course.location,
          Array.from(course.accounts).join("/")
        ].filter(Boolean).join(" | ");
        select.appendChild(opt);
      }
      if (current && Array.from(select.options).some(opt => opt.value === current)) {
        select.value = current;
        fillCourseFromValue(current);
      }
    }

    function setLatLng(lat, lng, zoom = mapState.zoom) {
      $("lat").value = Number(lat).toFixed(6);
      $("lng").value = Number(lng).toFixed(6);
      mapState = { lat: Number(lat), lng: Number(lng), zoom };
      renderMap();
      updatePreview();
      updateQuickLocationSelection();
    }

    function initQuickLocations() {
      const bar = $("quickLocationBar");
      if (!bar) return;
      const geoButton = $("geoBtn");
      bar.innerHTML = "";
      if (geoButton) bar.appendChild(geoButton);
      quickLocations.forEach((location) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "secondary";
        btn.textContent = location.name;
        btn.title = `${Number(location.lng).toFixed(6)}, ${Number(location.lat).toFixed(6)}`;
        btn.dataset.lat = Number(location.lat).toFixed(6);
        btn.dataset.lng = Number(location.lng).toFixed(6);
        btn.addEventListener("click", () => setLatLng(location.lat, location.lng, location.zoom || 16));
        bar.appendChild(btn);
      });
      updateGeoButtonDataset();
      updateQuickLocationSelection();
    }

    function updateLocationPanelSummary() {
      $("locationPanelSummary").textContent = $("locationPanel").open ? "收起位置栏" : "其他位置";
    }

    function sameCoordinate(a, b) {
      return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < 0.0000005;
    }

    function updateGeoButtonDataset() {
      const geoButton = $("geoBtn");
      if (!geoButton) return;
      const geoLat = parseFloat(localStorage.getItem(storageKeys.geoLat) || "");
      const geoLng = parseFloat(localStorage.getItem(storageKeys.geoLng) || "");
      if (Number.isFinite(geoLat) && Number.isFinite(geoLng)) {
        geoButton.dataset.lat = geoLat.toFixed(6);
        geoButton.dataset.lng = geoLng.toFixed(6);
        geoButton.title = `${geoLng.toFixed(6)}, ${geoLat.toFixed(6)}`;
      } else {
        delete geoButton.dataset.lat;
        delete geoButton.dataset.lng;
        geoButton.removeAttribute("title");
      }
    }

    function updateQuickLocationSelection() {
      const currentLat = parseFloat($("lat").value);
      const currentLng = parseFloat($("lng").value);
      document.querySelectorAll("#quickLocationBar button").forEach((btn) => {
        const lat = parseFloat(btn.dataset.lat || "");
        const lng = parseFloat(btn.dataset.lng || "");
        btn.classList.toggle(
          "selected",
          sameCoordinate(currentLat, lat) && sameCoordinate(currentLng, lng)
        );
      });
    }

    function clampZoom(zoom) {
      return Math.max(minMapZoom, Math.min(maxMapZoom, zoom));
    }

    function lonLatToWorld(lat, lng, zoom) {
      const scale = tileSize * Math.pow(2, zoom);
      const sin = Math.sin(lat * Math.PI / 180);
      return {
        x: (lng + 180) / 360 * scale,
        y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale
      };
    }

    function worldToLonLat(x, y, zoom) {
      const scale = tileSize * Math.pow(2, zoom);
      const lng = x / scale * 360 - 180;
      const n = Math.PI - 2 * Math.PI * y / scale;
      const lat = Math.atan(Math.sinh(n)) * 180 / Math.PI;
      return { lat, lng };
    }

    function mapRect() {
      return $("map").getBoundingClientRect();
    }

    function screenPointToWorld(clientX, clientY, state = mapState) {
      const rect = mapRect();
      const centerWorld = lonLatToWorld(state.lat, state.lng, state.zoom);
      return {
        x: centerWorld.x - rect.width / 2 + clientX - rect.left,
        y: centerWorld.y - rect.height / 2 + clientY - rect.top
      };
    }

    function setMapCenterKeepingScreenPoint(anchorClientX, anchorClientY, anchorWorldBefore, newZoom, sourceZoom = mapState.zoom) {
      const rect = mapRect();
      const anchorLatLng = worldToLonLat(anchorWorldBefore.x, anchorWorldBefore.y, sourceZoom);
      const anchorWorldAfter = lonLatToWorld(anchorLatLng.lat, anchorLatLng.lng, newZoom);
      const centerWorldAfter = {
        x: anchorWorldAfter.x - (anchorClientX - rect.left) + rect.width / 2,
        y: anchorWorldAfter.y - (anchorClientY - rect.top) + rect.height / 2
      };
      const center = worldToLonLat(centerWorldAfter.x, centerWorldAfter.y, newZoom);
      mapState = { lat: center.lat, lng: center.lng, zoom: newZoom };
      $("lat").value = Number(center.lat).toFixed(6);
      $("lng").value = Number(center.lng).toFixed(6);
      renderMap();
      updatePreview();
      updateQuickLocationSelection();
    }

    function zoomAt(clientX, clientY, delta) {
      const nextZoom = clampZoom(mapState.zoom + delta);
      if (nextZoom === mapState.zoom) return;
      const worldBefore = screenPointToWorld(clientX, clientY);
      setMapCenterKeepingScreenPoint(clientX, clientY, worldBefore, nextZoom);
    }

    function pointerDistance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function pointerMidpoint(a, b) {
      return {
        clientX: (a.clientX + b.clientX) / 2,
        clientY: (a.clientY + b.clientY) / 2
      };
    }

    function tileUrl(x, y, zoom) {
      const max = Math.pow(2, zoom);
      const wrappedX = ((x % max) + max) % max;
      return `https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=${wrappedX}&y=${y}&z=${zoom}`;
    }

    function renderMap() {
      const el = $("map");
      if (!el) return;
      const width = el.clientWidth || 600;
      const height = el.clientHeight || 320;
      const tileZoom = Math.floor(clampZoom(mapState.zoom));
      const visualScale = Math.pow(2, mapState.zoom - tileZoom);
      const center = lonLatToWorld(mapState.lat, mapState.lng, mapState.zoom);
      const topLeft = { x: center.x - width / 2, y: center.y - height / 2 };
      const startX = Math.floor((topLeft.x / visualScale) / tileSize);
      const endX = Math.floor(((topLeft.x + width) / visualScale) / tileSize);
      const startY = Math.floor((topLeft.y / visualScale) / tileSize);
      const endY = Math.floor(((topLeft.y + height) / visualScale) / tileSize);
      const maxY = Math.pow(2, tileZoom) - 1;

      el.querySelectorAll(".tile").forEach(node => node.remove());
      for (let x = startX; x <= endX; x++) {
        for (let y = startY; y <= endY; y++) {
          if (y < 0 || y > maxY) continue;
          const img = document.createElement("img");
          img.className = "tile";
          img.draggable = false;
          img.src = tileUrl(x, y, tileZoom);
          img.style.width = `${tileSize * visualScale}px`;
          img.style.height = `${tileSize * visualScale}px`;
          img.style.left = `${x * tileSize * visualScale - topLeft.x}px`;
          img.style.top = `${y * tileSize * visualScale - topLeft.y}px`;
          el.insertBefore(img, $("mapMarker"));
        }
      }
    }

    function setLatLngFromMapPoint(clientX, clientY, shouldRender = true) {
      const world = screenPointToWorld(clientX, clientY);
      const point = worldToLonLat(world.x, world.y, mapState.zoom);
      $("lat").value = Number(point.lat).toFixed(6);
      $("lng").value = Number(point.lng).toFixed(6);
      mapState.lat = point.lat;
      mapState.lng = point.lng;
      if (shouldRender) renderMap();
      updatePreview();
      updateQuickLocationSelection();
    }

    function initMap() {
      const savedLat = parseFloat($("lat").value);
      const savedLng = parseFloat($("lng").value);
      const center = Number.isFinite(savedLat) && Number.isFinite(savedLng) ? [savedLat, savedLng] : defaultCenter;
      mapState = { lat: center[0], lng: center[1], zoom: 16 };
      renderMap();
      $("map").addEventListener("click", (event) => {
        if (event.target.closest(".map-tools")) return;
        if (dragStart && dragStart.moved) return;
        setLatLngFromMapPoint(event.clientX, event.clientY);
      });
      $("map").addEventListener("pointerdown", (event) => {
        if (event.target.closest(".map-tools")) return;
        event.preventDefault();
        activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        $("map").setPointerCapture(event.pointerId);

        if (activePointers.size === 2) {
          const points = Array.from(activePointers.values());
          const mid = pointerMidpoint(points[0], points[1]);
          pinchStart = {
            distance: pointerDistance(points[0], points[1]),
            zoom: mapState.zoom,
            anchorClientX: mid.clientX,
            anchorClientY: mid.clientY,
            anchorWorld: screenPointToWorld(mid.clientX, mid.clientY)
          };
          isDraggingMap = false;
          dragStart = null;
          $("map").classList.add("dragging");
          return;
        }

        isDraggingMap = true;
        dragStart = {
          x: event.clientX,
          y: event.clientY,
          lat: mapState.lat,
          lng: mapState.lng,
          moved: false
        };
        $("map").classList.add("dragging");
      });
      $("map").addEventListener("pointermove", (event) => {
        if (activePointers.has(event.pointerId)) {
          activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        }

        if (activePointers.size >= 2 && pinchStart) {
          event.preventDefault();
          const points = Array.from(activePointers.values()).slice(0, 2);
          const currentDistance = pointerDistance(points[0], points[1]);
          if (pinchStart.distance > 0 && currentDistance > 0) {
            const zoomDelta = Math.log2(currentDistance / pinchStart.distance);
            const nextZoom = clampZoom(pinchStart.zoom + zoomDelta);
            setMapCenterKeepingScreenPoint(
              pinchStart.anchorClientX,
              pinchStart.anchorClientY,
              pinchStart.anchorWorld,
              nextZoom,
              pinchStart.zoom
            );
          }
          return;
        }

        if (!isDraggingMap || !dragStart) return;
        event.preventDefault();
        const dx = event.clientX - dragStart.x;
        const dy = event.clientY - dragStart.y;
        if (Math.abs(dx) + Math.abs(dy) < 3) return;
        dragStart.moved = true;
        const startWorld = lonLatToWorld(dragStart.lat, dragStart.lng, mapState.zoom);
        const next = worldToLonLat(startWorld.x - dx, startWorld.y - dy, mapState.zoom);
        $("lat").value = Number(next.lat).toFixed(6);
        $("lng").value = Number(next.lng).toFixed(6);
        mapState.lat = next.lat;
        mapState.lng = next.lng;
        renderMap();
        updatePreview();
        updateQuickLocationSelection();
      });
      $("map").addEventListener("pointerup", (event) => {
        if (isDraggingMap) {
          event.preventDefault();
        }
        activePointers.delete(event.pointerId);
        try { $("map").releasePointerCapture(event.pointerId); } catch {}
        isDraggingMap = false;
        pinchStart = null;
        if (activePointers.size === 1) {
          const only = Array.from(activePointers.values())[0];
          isDraggingMap = true;
          dragStart = {
            x: only.clientX,
            y: only.clientY,
            lat: mapState.lat,
            lng: mapState.lng,
            moved: true
          };
        } else {
          $("map").classList.remove("dragging");
        }
      });
      $("map").addEventListener("pointercancel", (event) => {
        activePointers.delete(event.pointerId);
        try { $("map").releasePointerCapture(event.pointerId); } catch {}
        isDraggingMap = false;
        pinchStart = null;
        $("map").classList.remove("dragging");
      });
      $("map").addEventListener("wheel", (event) => {
        event.preventDefault();
        zoomAt(event.clientX, event.clientY, -event.deltaY / 350);
      }, { passive: false });
      $("map").addEventListener("dblclick", (event) => {
        event.preventDefault();
        zoomAt(event.clientX, event.clientY, 1);
      });
      if (!Number.isFinite(savedLat) || !Number.isFinite(savedLng)) {
        setLatLng(center[0], center[1], 16);
      }
      window.addEventListener("resize", renderMap);
      $("locationPanel").addEventListener("toggle", (event) => {
        updateLocationPanelSummary();
        if (event.target.open) renderMap();
      });
    }

    $("sendBtn").addEventListener("click", async () => {
      try {
        updatePreview();
        const body = validateSignInput();
        const tokens = allTokens();
        setStatus(`正在为 ${tokens.length} 个账号发送签到请求...`);
        const results = await Promise.all(tokens.map(async (account) => {
          try {
            const result = await postJson("/wechat/checkIn/checkInWithLocation", body, account);
            return { account: account.label, ok: true, result };
          } catch (err) {
            return { account: account.label, ok: false, error: err.message };
          }
        }));
        setStatus(JSON.stringify(results, null, 2));
      } catch (err) {
        setStatus("ERROR: " + err.message);
      }
    });

    $("coursesBtn").addEventListener("click", async () => {
      try {
        await loadCourses();
      } catch (err) {
        setStatus("ERROR: " + err.message);
      }
    });

    $("geoBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("ERROR: 当前浏览器不支持定位。\n\n可改用地图点击或拖动来选择经纬度。");
        return;
      }
      setStatus("正在读取定位...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          localStorage.setItem(storageKeys.geoLat, Number(pos.coords.latitude).toFixed(6));
          localStorage.setItem(storageKeys.geoLng, Number(pos.coords.longitude).toFixed(6));
          updateGeoButtonDataset();
          setLatLng(pos.coords.latitude, pos.coords.longitude, mapState.zoom);
          setStatus("定位已填入");
        },
        (err) => setStatus(geolocationErrorText(err)),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    $("copyJsonBtn").addEventListener("click", async () => {
      updatePreview();
      await copyText(JSON.stringify(bodyObject(), null, 2));
    });

    $("copyCurlBtn").addEventListener("click", async () => {
      updatePreview();
      await copyText(await curlCommand());
    });
    $("zoomInBtn").addEventListener("click", () => {
      mapState.zoom = clampZoom(mapState.zoom + 1);
      renderMap();
    });
    $("zoomOutBtn").addEventListener("click", () => {
      mapState.zoom = clampZoom(mapState.zoom - 1);
      renderMap();
    });
    $("centerSchoolBtn").addEventListener("click", () => setLatLng(defaultCenter[0], defaultCenter[1], 16));

    function scheduleAutoCourses() {
      clearTimeout(autoCourseTimer);
      autoCourseTimer = setTimeout(async () => {
        const tokenSignature = allTokens().map(item => item.raw).join("|");
        if (!tokenSignature || tokenSignature === lastAutoCourseToken) return;
        lastAutoCourseToken = tokenSignature;
        try {
          await loadCourses({ silent: true, auto: true });
        } catch (err) {
          setStatus("自动获取课程列表失败: " + err.message);
        }
      }, 900);
    }

    $("addTokenBtn").addEventListener("click", () => {
      tokenPaneCount = tokenPaneCount === 1 ? 2 : 4;
      applyTokenPaneCount();
      updatePreview();
    });
    $("removeTokenBtn").addEventListener("click", () => {
      tokenPaneCount = tokenPaneCount === 4 ? 2 : 1;
      applyTokenPaneCount();
      updatePreview();
    });

    for (let i = 0; i < maxTokenPanes; i++) {
      $(`token${i}`).addEventListener("input", () => {
        updatePreview();
        scheduleAutoCourses();
      });
    }

    ids.forEach((id) => {
      $(id).addEventListener("input", () => {
        updatePreview();
        if (id === "lat" || id === "lng") updateQuickLocationSelection();
        if (id === "baseUrl") scheduleAutoCourses();
      });
    });
    $("courseSelect").addEventListener("change", () => fillCourseFromValue($("courseSelect").value));
    restoreState();
    updatePreview();
    initQuickLocations();
    updateLocationPanelSummary();
    initMap();
    if (allTokens().length) scheduleAutoCourses();
  </script>
</body>
</html>
